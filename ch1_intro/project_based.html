
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind CSS Beginner Project</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="bg-green-800 text-white p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">

            <a href="#" class="text-xl font-bold">
                My Website
            </a>

            <ul class="hidden md:flex space-x-4">
                <li><a href="#" class="hover:text-gray-300">Home</a></li>
                <li><a href="#" class="hover:text-gray-300">About</a></li>
                <li><a href="#" class="hover:text-gray-300">Contact</a></li>
            </ul>

        </div>
    </nav>


    <!-- WELCOME CARD -->
    <div class="max-w-sm mx-auto bg-black shadow-2xl rounded-3xl p-6 mt-8 text-white">

        <h2 class="text-xl font-semibold">
            Welcome to Tailwind CSS
        </h2>

        <p class="text-gray-300 mt-2">
            This is a beginner-level project to learn the basics of Tailwind.
        </p>

        <button class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-pink-600">
            Learn More
        </button>

    </div>


    <!-- FLEXBOX SECTION -->
    <div class="flex justify-between items-center bg-green-100 p-4 h-96 mt-8">

        <div class="bg-blue-500 text-white p-4">Item 1</div>

        <div class="bg-blue-400 text-white p-4">Item 2</div>

        <div class="bg-blue-300 text-white p-4">Item 3</div>

        <div class="bg-blue-200 text-white p-4">Item 4</div>

    </div>


    <!-- CONTACT FORM -->
    <form class="max-w-lg mx-auto bg-gray-100 shadow-lg rounded p-6 mt-8">

        <div>
            <label for="name" class="block text-gray-700">
                Name
            </label>

            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your name"
                required
                class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
        </div>


        <div class="mt-4">
            <label for="email" class="block text-gray-700">
                Email
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                required
                class="w-full mt-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
            >
        </div>


        <button
            type="submit"
            class="mt-6 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
        >
            Submit
        </button>

    </form>

</body>
</html>
